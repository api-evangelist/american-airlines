- type: Features
  data:
  - name: Runway Developer Experience Platform
    description: Internal developer platform built on Spotify's Backstage providing
      centralized API management, service catalog, and self-service infrastructure
      tooling for engineering teams.
  - name: Flight Data APIs
    description: APIs for querying flight schedules, routes, status information, and
      operational data across American Airlines' domestic and international network.
  - name: Booking and Reservation APIs
    description: APIs supporting flight search, booking, reservation management, and
      passenger services integration for travel applications.
  - name: Built-In API Management
    description: Runway provides integrated API management with security, authentication
      toggles, and corporate authentication capabilities for development teams.
  - name: Service Mesh Integration
    description: Kong-based service mesh enabling reliable microservices communication
      and traffic management across the American Airlines platform.
  - name: Open Source Tooling
    description: American Airlines maintains open-source tools including Flight Engine
      (mock flight data API), Hangar (hackathon management), and Backstage plugins
      via the AmericanAirlines GitHub organization.
- type: UseCases
  data:
  - name: Flight Search and Booking
    description: Travel agencies and booking platforms integrate flight availability,
      pricing, and reservation APIs to offer American Airlines flights.
  - name: Flight Status Tracking
    description: Applications query real-time flight status, departure, arrival, and
      delay information for American Airlines flights.
  - name: Internal Developer Tooling
    description: American Airlines engineering teams use Runway to self-service infrastructure,
      register APIs in the service catalog, and manage deployments.
  - name: Hackathon and Innovation
    description: Open-source Hangar tool enables hackathon management for tech innovation
      events sponsored by or affiliated with American Airlines.
- type: Integrations
  data:
  - name: Spotify Backstage
    description: Runway developer portal is built on Spotify's Backstage platform
      for internal developer experience and service catalog management.
  - name: Kong Service Mesh
    description: American Airlines uses Kong's Kuma service mesh for microservices
      networking and API gateway capabilities.
  - name: HashiCorp Vault
    description: Integration with HashiCorp Vault for secrets management in build
      pipelines via open-source vault-action GitHub Action.
  - name: Dynatrace
    description: Python API client for Dynatrace integration maintained in the AmericanAirlines
      GitHub organization.
