aid: american-airlines
name: American Airlines
description: American Airlines is one of the world's largest airlines, operating an
  extensive domestic and international route network. The company's Runway developer
  experience platform, built on Spotify's Backstage, provides internal developer tooling
  and API management for engineering teams. American Airlines exposes flight data,
  status, and booking capabilities through its developer portal, and maintains an
  active open-source presence via the AmericanAirlines GitHub organization.
