specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: American Airlines
providerId: american-airlines
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Airlines
  - Aviation
  - Flights
  - Travel
  - Booking
  - Developer Experience
  - Rate Limiting
description: >-
  American Airlines does not publish public Runway API rate limits. The platform is internal-only; external GDS/NDC integrations operate under partner-specific throughput and SLA terms. Reconcile if public limits are published.
notes: >-
  American Airlines' Runway platform (built on Spotify Backstage) is American Airlines' internal developer experience for engineering teams - not a publicly consumable, priced API. External flight data, booking, and status integrations are delivered through GDS partners (Sabre, Amadeus) and corporate / NDC channels under bilateral agreements. No public price list or rate-limit documentation is published. Reconcile if a public API tier emerges.
sources:
  - https://developer.aa.com/
  - https://github.com/AmericanAirlines
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: Undocumented - bilateral agreement
    scope: contract
    metric: varies
    limit: 'see partner agreement; not publicly documented'
policies:
  - name: Documentation Status
    description: >-
      American Airlines does not publish public per-second or per-minute API rate
      limits. Throughput, concurrency, and burst behavior are governed by the
      relevant partner, supplier, or merchant agreement.
  - name: Backoff Strategy
    description: >-
      Where any HTTP API is exposed, clients should implement exponential
      backoff with jitter and honor any Retry-After header returned on 429
      or 503 responses.
maintainers:
